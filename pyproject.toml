# Metadata declaration for tooling: project identity and the supported
# Python floor. This is not a buildable package — runtime dependencies stay
# pinned in requirements.txt / requirements-dev.txt and the app runs from
# source (python server.py), so no build-system is declared here.
[project]
name = "openglaze"
version = "1.1.0"
description = "Free open-source ceramic glaze calculator, UMF analyzer, and recipe manager for potters and studios."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
# Size standard (matches kinocut): hard 120-char cap, enforced via E501
# below. Black remains the formatter at 88 — a repo-wide reformat is not
# part of the size-discipline change; see scripts/check_sizes.py for the
# function/file size gate.
line-length = 120

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) plus E501 so the 120-char cap is actually
# enforced on the lines Black never wraps: long strings, comments, prose.
select = ["E4", "E7", "E9", "F", "E501"]

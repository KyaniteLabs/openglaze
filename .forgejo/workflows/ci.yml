name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Unique per push commit so queued main runs are never replaced; per PR otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: KyaniteLabs/.github/.forgejo/workflows/ci-profile.yml@c897272be925447cca1f42f06291d320f326960f
  test:
    runs-on: docker
    container:
      # The docker label's default image (node:26-bookworm) ships Debian
      # bookworm's python3.11, which dies on the repo's py>=3.12 floor before
      # lint/tests run. Run the suite at the declared floor itself on the
      # official python image, digest-pinned like ci-profile.yml pins node.
      image: python:3.12-bookworm@sha256:14a4933e6cef421424f7a66d89a3f4eafcbd0d90e0a822251f298e05132dc735
    steps:
      - name: Install checkout runtime and build deps
        # actions/checkout runs as node inside the job container and the
        # official python image ships neither node nor git (measured: exit
        # 127 "node: executable file not found"). Same pre-step as
        # fl4write/mutation.yml and submission-pipeline/ci.yml.
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs libpq-dev libffi-dev libssl-dev gcc
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check supported Python and install dependencies
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "OpenGlaze requires Python 3.12+"'
          python3 -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          set -eu
          python3 -m black --check .
          python3 -m ruff check .
      - name: Test
        run: |
          set -eu
          python3 -m pytest tests/ --tb=short -q
